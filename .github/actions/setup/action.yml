name: Setup
description: Set up Node.js and install dependencies
inputs:
  registry-url:
    description: npm registry to authenticate against (only needed for publishing)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'yarn'
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      run: yarn --immutable
      env:
        HUSKY_SKIP_INSTALL: 'true'
        # Cypress runs on the Nx Cloud agents, never on the GitHub runner
        CYPRESS_INSTALL_BINARY: '0'
